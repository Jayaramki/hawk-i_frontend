---
deployment:
  tasks:
    - export DEPLOYPATH=/home/tapntrac/public_html/hawk-i.tapntrack.in

    - echo "Setting up Node.js environment..."
    - export PATH="/opt/cpanel/ea-nodejs20/bin:$PATH" || export PATH="/opt/cpanel/ea-nodejs18/bin:$PATH" || export PATH="/opt/cpanel/ea-nodejs16/bin:$PATH"
    - which node || echo "Node.js not found, trying alternative paths..."
    - which npm || echo "npm not found, trying alternative paths..."

    - echo "Building Angular frontend..."
    - npm install || (echo "npm install failed" && exit 1)
    - npm run build -- --configuration production || (echo "Build failed" && exit 1)

    - echo "Checking build output..."
    - ls -la dist/hawk-i_frontend/browser/ || (echo "Build output not found" && exit 1)

    - echo "Deploying Angular build to $DEPLOYPATH"
    - mkdir -p $DEPLOYPATH || (echo "Failed to create deployment directory" && exit 1)
    - /bin/cp -R dist/hawk-i_frontend/browser/* $DEPLOYPATH/ || (echo "Copy failed" && exit 1)

    - echo "Verifying deployment..."
    - ls -la $DEPLOYPATH/ || (echo "Deployment verification failed" && exit 1)
    - echo "Angular deployment completed successfully!"