<app-layout>
  <div class="p-6">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Attendance Management</h1>
      <p class="text-gray-600 dark:text-gray-400">Manage and track employee attendance records with day, week, and month views</p>
    </div>
    
    <!-- Tab Navigation -->
    <app-tab 
      [tabs]="tabs"
      [activeTab]="activeTab()"
      (tabChange)="onTabChange($event)">
      
      <!-- Day View Tab -->
      <app-tab-panel 
        id="day" 
        [isActive]="activeTab() === 'day'">
        <app-attendance-day-view></app-attendance-day-view>
      </app-tab-panel>
      
      <!-- Week View Tab -->
      <app-tab-panel 
        id="week" 
        [isActive]="activeTab() === 'week'">
        <app-attendance-week-view></app-attendance-week-view>
      </app-tab-panel>
      
      <!-- Month View Tab -->
      <app-tab-panel 
        id="month" 
        [isActive]="activeTab() === 'month'">
        <app-attendance-month-view></app-attendance-month-view>
      </app-tab-panel>
      
    </app-tab>
  </div>
</app-layout>
